# #500: mutation-testing pilot config (mutmut 3.x).
# source_paths = code root copied into mutants/; only_mutate restricts the
# pilot to a bounded module set so a run stays minutes, not hours. Expand
# only_mutate to widen coverage; keep the selection explicit either way.
[mutmut]
source_paths=agent_runtime
only_mutate=
    agent_runtime/confirmation_policy.py
pytest_add_cli_args_test_selection=tests/test_issue_499_confirmation_policy.py
