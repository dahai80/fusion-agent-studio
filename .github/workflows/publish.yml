name: publish

# Publish the fusion-agent-studio package to PyPI. Fires when a GitHub
# release is published (the release step already gates on a green CI run of
# the release PR, so this reuses that signal instead of re-running tests).
# Auth: PyPI trusted publishing (OIDC) — no token secret stored. One-time
# setup on pypi.org (pending publisher): project "fusion-agent-studio",
# owner dahai80, repo fusion-agent-studio, workflow publish.yml,
# environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, skip the PyPI upload"
        default: true
        type: boolean

permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist -o dist/
      - name: Sanity-check the wheel
        run: |
          python -m pip install --index-url https://pypi.org/simple/ dist/*.whl
          python -c "from agent_runtime.api_server import _app_version; print('wheel ok', _app_version())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing requires id-token: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip when version already on PyPI
        id: check
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -sf "https://pypi.org/pypi/fusion-agent-studio/$VER/json" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "version $VER already on PyPI — skipping upload"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "version $VER not on PyPI — will publish"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        if: steps.check.outputs.present != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  # Every published release carries per-platform bundles (Windows zip,
  # Ubuntu tar.gz, macOS tar.gz) uploaded as release assets. Each bundle
  # contains the universal wheel plus OS-specific install instructions
  # and a sha256 checksum.
  release-assets:
    needs: build
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: ubuntu
          - os: macos-15
            platform: macos
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create bundle
        shell: bash
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          BUNDLE="fusion-agent-studio-${VER}-${{ matrix.platform }}"
          mkdir -p "$BUNDLE"
          cp dist/*.whl "$BUNDLE"/
          cp dist/*.tar.gz "$BUNDLE"/ 2>/dev/null || true
          if [ "${{ matrix.platform }}" = "windows" ]; then
            sed "s/__VERSION__/${VER}/" packaging/bundle/INSTALL-windows.txt > "$BUNDLE/INSTALL.txt"
          else
            sed "s/__VERSION__/${VER}/; s/__PLATFORM__/${{ matrix.platform }}/" packaging/bundle/INSTALL-unix.txt > "$BUNDLE/INSTALL.txt"
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path '$BUNDLE' -DestinationPath '${BUNDLE}.zip'"
            echo "ARCHIVE=${BUNDLE}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${BUNDLE}.tar.gz" "$BUNDLE"
            echo "ARCHIVE=${BUNDLE}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"; fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$ARCHIVE" "$ARCHIVE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
