name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,rag]"

      - name: Lint (ruff)
        run: ruff check agent_runtime tools server tests

      - name: Test with coverage
        run: pytest tests/ -q --cov=agent_runtime --cov=tools --cov=server --cov-report=term-missing --cov-fail-under=80
