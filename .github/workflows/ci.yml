name: CI

# #670: CI efficiency retrofit (dahai80/fusion#2 checklist).
# - concurrency: repeated pushes to the same ref cancel the older run
# - pip cache on every setup-python job
# - path filters: docs-only changes skip the suites (jobs report skipped,
#   which satisfies required checks)
# - tiered gate: PR = lint + sharded unit tests (no coverage); nightly
#   schedule runs the authoritative coverage gate (--cov-fail-under)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 18:00 UTC = 02:00 CST nightly — authoritative coverage run.
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'agent_runtime/**'
              - 'tools/**'
              - 'server/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'setup.cfg'
              - 'start.sh'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    # #673 follow-up: no job-level skip — docs-only PRs must still report the
    # required "test (N)" check names, so the matrix legs always run and the
    # content steps no-op when Python paths are untouched.
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        if: needs.changes.outputs.python == 'true'
        run: pip install git+https://github.com/dahai80/fusion-core.git@v0.8.0

      - name: Install dependencies
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,rag]"

      - name: Lint (ruff)
        if: needs.changes.outputs.python == 'true' && matrix.shard == 0
        run: ruff check agent_runtime tools server tests

      # #670: PR gate runs the unit suite sharded 3-way (round-robin on test
      # files, no coverage). Coverage is enforced by the nightly `coverage`
      # job so the gate stays fast. tests/e2e runs in its own job; tests/proof
      # scripts are the `proof` job.
      - name: Sharded unit tests
        if: needs.changes.outputs.python == 'true'
        run: pytest $(ls tests/test_*.py | awk -v s=${{ matrix.shard }} 'NR % 3 == s') -q --timeout=120

  coverage:
    # #670: authoritative coverage gate — nightly, full suite, --cov-fail-under.
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git@v0.8.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,rag]"

      - name: Test with coverage
        run: pytest tests/ -q --cov=agent_runtime --cov=tools --cov=server --cov-report=term-missing --cov-fail-under=60 --timeout=120

  # M1-7 (#306): proof scripts — concurrent dequeue safety, crash-recovery
  # reconcile, publish idempotency. M1 exit gate.
  proof:
    needs: changes
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        if: needs.changes.outputs.python == 'true'
        run: pip install git+https://github.com/dahai80/fusion-core.git@v0.8.0

      - name: Install dependencies
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,rag]"

      - name: Proof 1 — queue concurrency (4×20, zero dup)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_queue_concurrency.py

      - name: Proof 2 — crash recovery (SIGKILL + restart reconcile)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_recovery.py

      - name: Proof 3 — publish idempotent (restart no re-send)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_publish_idempotent.py

      # #480: funnel-era proofs — previously cited as acceptance evidence
      # but invisible to CI. Same job as the legacy proofs.
      - name: Proof 4 — funnel chain (compaction events + metering)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_funnel_chain.py

      - name: Proof 5 — permission deny-first (safety gateway never invoked)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_permission_deny_first.py

      - name: Proof 6 — lifecycle compaction (bus + funnel wiring)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_lifecycle_compaction.py

      - name: Proof 7 — long-session compaction (level escalation)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_long_session_compaction.py

      # #486: approval-noise baseline measurement — asks/100-calls on a fixed
      # 100-call workload, baseline vs armed engine, asserts >= 70% reduction.
      - name: Proof 8 — approval noise (baseline vs armed, >= 70%)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_approval_noise.py

      # E1: session-level run budget — truncation point within 1 round of cap.
      - name: Proof 9 — budget enforcement (truncation <= 1 round)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_budget_enforcement.py

      # E2: eval runner — 20-case dataset reproducible across runs + trace replay.
      - name: Proof 10 — eval runner (reproducible + replay)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_eval_runner.py

      # E5: offline reviewer — 3 injected overreach flagged, benign baseline
      # zero false positives, findings land in audit log.
      - name: Proof 11 — offline reviewer (overreach hit + zero FP baseline)
        if: needs.changes.outputs.python == 'true'
        run: python tests/proof/prove_offline_reviewer.py


  # #327: web UI — typecheck + build the union-web shell module. Self-contained:
  # @fusion/web-ui and @fusion/web-sdk are vendored in web/vendor/@fusion (no
  # registry/network fetch beyond bun + vite themselves).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # #573: pinned to the bun version that builds the committed web/dist —
      # the dist freshness guard rebuilds and byte-compares, so the builder
      # version must match the local one or the hash churns (1.4.4 ≠ 1.3.14).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      # #489: component tests for the governance-critical surfaces
      # (GovernancePage tabs/mutations, canvas safety approve/reject,
      # RPC-failure error paths).
      - name: Component tests
        working-directory: web
        run: bun run test

      - name: Build
        working-directory: web
        run: bun run build

      # #573 follow-up: a PR touching web/src must commit the rebuilt
      # web/dist — the daemon serves the committed bundle, so a stale dist
      # ships a UI that is missing the newest features (happened at #568).
      - name: Dist freshness guard
        working-directory: web
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::web/dist is stale — rebuild (cd web && bun install && bun run build) and commit dist"
            git status --porcelain dist
            exit 1
          fi

  # #500: E2E — real daemon subprocess + stub MLX + Playwright chromium
  # against the built web dist. The suite self-skips when playwright or the
  # dist is missing, so this job stays green even if setup regresses.
  e2e:
    needs: changes
    # No job-level skip: required "e2e" check name must be reported on every
    # PR, including docs-only ones. Content steps gate instead.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Bun
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        if: needs.changes.outputs.python == 'true'
        run: pip install git+https://github.com/dahai80/fusion-core.git@v0.8.0

      - name: Install Python dependencies
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install playwright

      - name: Install Playwright chromium
        if: needs.changes.outputs.python == 'true'
        run: playwright install chromium

      - name: Build web dist
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: E2E (stubbed LLM, real daemon + browser)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
        run: pytest tests/e2e -m e2e -v --timeout=180

  # #500: mutation pilot — agent_runtime/confirmation_policy.py (setup.cfg).
  # Informational: survivors are reported but never fail the build; the pilot
  # exists to surface weak-test spots, not to gate merges.
  mutation:
    needs: changes
    runs-on: macos-15
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        if: needs.changes.outputs.python == 'true'
        run: pip install git+https://github.com/dahai80/fusion-core.git@v0.8.0

      - name: Install dependencies
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install mutmut

      - name: Run mutation pilot
        if: needs.changes.outputs.python == 'true'
        run: |
          mutmut run || true
          mutmut results || true
          mutmut junitxml > mutation-report.xml || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.xml
